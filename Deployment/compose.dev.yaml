name: cambodia-digital-banking-dev

services:
  api:
    image: cambodia-digital-banking-api:dev
    build:
      context: ..
      dockerfile: Deployment/docker/Dockerfile
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CambodiaDigitalBanking;User Id=sa;Password=${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ../CambodiaDigitalBankingSystem.API:/src/CambodiaDigitalBankingSystem.API
    depends_on:
      database-init:
        condition: service_completed_successfully
    init: true

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
    ports:
      - "${SQL_PORT:-1434}:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  database-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null; do sleep 2; done;
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID(N'CambodiaDigitalBanking') IS NULL CREATE DATABASE [CambodiaDigitalBanking];" -b
    environment:
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

volumes:
  sql_data:
